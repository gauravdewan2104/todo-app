<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── AUTH SCREEN ──────────────────────────────────────
       Shown when no user is logged in. Hidden by JS once a
       session is detected. -->
  <div id="auth-screen">
    <div class="card">
      <h1>My To-Do List</h1>
      <p class="auth-subtitle">Sign in to see your tasks</p>

      <!-- Email and password fields shared by both login and signup -->
      <div class="auth-fields">
        <input type="email"    id="auth-email"    placeholder="Email"    autocomplete="email" />
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
      </div>

      <!-- Two separate buttons for the two actions -->
      <div class="auth-buttons">
        <button id="login-btn">Log in</button>
        <button id="signup-btn" class="btn-secondary">Sign up</button>
      </div>

      <!-- Feedback area: shows errors or success messages -->
      <p id="auth-msg" class="auth-msg"></p>

      <!-- Divider between email/password and OAuth options -->
      <div class="auth-divider"><span>or</span></div>

      <!-- Google OAuth button — triggers a redirect to Google's login page -->
      <button id="google-btn" class="btn-google">Sign in with Google</button>
    </div>
  </div>

  <!-- ── APP SCREEN ───────────────────────────────────────
       Shown only when a user is logged in. Hidden initially. -->
  <div id="app-screen">
    <div class="card">

      <!-- User bar: logged-in email on the left, log out on the right -->
      <div class="user-bar">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn">Log out</button>
      </div>

      <h1>My To-Do List</h1>

      <!-- Input area: unchanged from before -->
      <div class="input-row">
        <input
          type="text"
          id="task-input"
          placeholder="What needs doing?"
          autocomplete="off"
        />
        <button id="add-btn">Add</button>
      </div>

      <p id="counter" class="counter"></p>
      <p id="error-msg" class="error-msg">Couldn't reach the database</p>
      <ul id="task-list"></ul>
      <p id="empty-msg" class="empty-msg">No tasks yet</p>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
